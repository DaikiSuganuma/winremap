# 受け入れ用（v0.8 §2.3 の M-1〜M-6）。
#
# パネルとカーソルの両方を有効にしてある。M-6 だけは enabled = false に
# 書き換えて再読み込みし、「パネルを出さずにカーソルだけ」を確かめる。
#
# cursor_color は書いていない ＝ 既定（#0078d4、WinRemap のアイコンの青）で
# 試す。別の色を見たいときだけ足すこと — 既定が実際に使える色かどうかも
# この受け入れで見ている。
[ime_indicator]
enabled = true
change_cursor_color = true
# 半角/全角 キーが無いキーボードでは、これが無いと IME を切り替えても
# 追随しない（前面が変わったときしか状態を取り直さない — ADR 0021）。
# 2026-08-03 の受け入れで、これが無いために M-1 が「色が変わらない」に
# 見えた。刻印に 半角/全角 がある機械では余分だが、あって困らない。
trigger_keys = ["C-Space"]
# パネルの下に前面アプリの名前を出す（ADR 0024）。既定はオフ。
show_app_name = true

[[keymap]]
name = "accept"
application = ["*"]

[keymap.remap]
"C-h" = "Back" # H-1 と同じキー。カーソルを見ながらリマップも生きていること
