# 受け入れ用（手動最小集合 H-1〜H-10）。
#
# H-* にはこれまで準備が無かった。そのため 2026-08-08 の受け入れは実運用の
# 設定（notepad.exe だけを対象にした最小設定）のまま H-1 を実施し、PHPStorm
# でも Zed でも WinRemap が何も変換していない状態を見ていた。そこで起きた
# 単語削除は素の Ctrl+H の動きそのもの ＝ このプロジェクトの発端の問題で
# あり、額面どおり書けば「発端の問題が再発した」という記録になっていた。
# この設定はその穴を塞ぐためにある。
#
# 対象を ["*"] にしてあるのは、H-1 が PHPStorm・Zed・Windows Terminal と
# いった「そのとき手元にあるターミナル」で測る項目だからである。アプリ名を
# 数え上げる形にすると、数え漏らしたアプリが「不合格」に化ける。

# --- H-7・H-8（マクロ記憶とバナー）---
[macro]
# record_stop を省略 ＝ 開始と同じキーで終了する。F10 系にしてあるのは、
# 記憶中に打つ普通の文字と衝突しないため。
record_start = "S-F10"
record_play = "F10"

# --- H-2・H-5（IME とカーソル）---
[ime_indicator]
enabled = true
# H-2 の見どころ。IME を切り替えるたびに SetSystemCursor が走るので、
# 打鍵が引っかからないかをこの版だけ意識して見る。
change_cursor_color = true
# 半角/全角 キーが無いキーボードでは、これが無いと IME を切り替えても
# 追随しない（前面が変わったときしか状態を取り直さない — ADR 0021）。
trigger_keys = ["C-Space"]
show_app_name = true

# --- H-1・H-10（リマップ本体）---
[[keymap]]
name = "accept"
application = ["*"]

[keymap.remap]
# 発端の問題。1 文字削除になること。
"C-h" = "Back"
# H-1 の判定は C-h だけだと交絡する — PowerShell に Emacs キーバインドを
# 当てていると、WinRemap 抜きでも C-h は 1 文字消える（2026-08-10 の P-7 で
# 踏んだ）。こちらは素の Windows では全選択になるので、行頭へ動けば
# 「WinRemap が効いている」と言い切れる。
"C-a" = "Home"
