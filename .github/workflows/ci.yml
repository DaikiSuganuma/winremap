name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      # The UI-test build is off by default and never shipped (ADR 0053), so
      # nothing else would catch it rotting. Release artifacts stay
      # feature-free: release.yml builds without any --features.
      - name: Clippy (test-inject)
        run: cargo clippy --all-targets --features test-inject -- -D warnings
      - name: Test (test-inject)
        run: cargo test --features test-inject
      # site/ is committed but generated (ADR 0066). Without this, an edit to
      # site-src/ that was never built would ship the old pages, and an edit
      # made directly in site/ would look like it worked until the next build
      # silently reverted it.
      - name: Install Zola
        run: |
          Invoke-WebRequest -Uri https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-pc-windows-msvc.zip -OutFile zola.zip
          Expand-Archive zola.zip -DestinationPath $env:RUNNER_TEMP\zola
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\zola"
      - name: Help site is up to date
        run: .\site-src\build.ps1 -Check
