name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      # The UI-test build is off by default and never shipped (ADR 0053), so
      # nothing else would catch it rotting. Release artifacts stay
      # feature-free: release.yml builds without any --features.
      - name: Clippy (test-inject)
        run: cargo clippy --all-targets --features test-inject -- -D warnings
      - name: Test (test-inject)
        run: cargo test --features test-inject
