[package]
name = "winremap"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "A per-application key remapper for Windows, written in Rust"
repository = "https://github.com/DaikiSuganuma/winremap"
keywords = ["keyboard", "remap", "windows", "hotkey"]
categories = ["os::windows-apis"]

# Distribution binary: thin LTO and symbol stripping keep the single-exe
# download small without the compile-time cost of full LTO.
[profile.release]
lto = "thin"
strip = true

# `test-inject` lets the UI-test agent's SendInput be remapped, which the
# unconditional pass-through of injected events otherwise prevents (ADR 0053).
# Default OFF: release artifacts must never contain it. Build test binaries
# with `cargo build --release --features test-inject`.
[features]
default = []
test-inject = []

[dependencies]
anyhow = "1"
arc-swap = "1.9.2"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "glow", "default_fonts"] }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3.2"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25.13"
tray-icon = "0.24.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
winit = "0.30.13"

# Until eframe creates an AccessKit adapter for child viewports and not only
# the root, the settings and log windows expose nothing to UI Automation —
# they are deferred child viewports (ADR 0037). The branch is 0.35.0 plus that
# one change (ADR 0055).
#
# REMOVE THIS once the change is upstream and in a published eframe: the pin
# is a stopgap, and leaving it would silently hold the whole egui stack at
# 0.35.0.
[patch.crates-io]
eframe = { git = "https://github.com/DaikiSuganuma/egui", branch = "accesskit-child-viewports" }

[dev-dependencies]
# `examples/msix_assets.rs` only. Already vetted as a build-dependency below;
# this entry exists because examples cannot see those. Default features are
# on here (the build-dependency turns them off) for `Pixmap::encode_png`.
resvg = "0.47.0"

[build-dependencies]
# Build-time only: rasterizes the menu icons (ADR 0040). No runtime cost and
# nothing of it ends up in the binary — only the pixels it produces do.
# Text and raster-image support are off; the icons are pure paths.
resvg = { version = "0.47.0", default-features = false }
winresource = "0.1.31"
